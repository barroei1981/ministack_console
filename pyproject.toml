[project]
name = "ministack-console"
version = "0.1.0"
description = "Dual-interface control-plane for MiniStack AWS emulator"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "falkordb>=1.7.0",
    "aioboto3>=12.0.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "mypy>=1.7.1",
    "ruff>=0.1.6",
    "httpx2>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["control_plane*", "api*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (may require docker)",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
