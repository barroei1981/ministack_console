version: '3.8'

services:
  # MiniStack - AWS emulator
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack_console_ministack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,dynamodb,sqs,sns,cloudwatch
      - DEBUG=1
    volumes:
      - ministack_data:/var/lib/ministack
    networks:
      - ministack_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_ministack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FalkorDB - Graph database for control-plane
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ministack_console_falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - ministack_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Control-Plane API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ministack_console_api
    ports:
      - "3001:3001"
    environment:
      - API_PORT=3001
      - MINISTACK_ENDPOINT=http://ministack:4566
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_DB=0
      - AWS_ACCESS_KEY_ID=000000000001
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      ministack:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    networks:
      - ministack_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MCP Server
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: ministack_console_mcp
    ports:
      - "3100:3100"
    environment:
      - MCP_SERVER_PORT=3100
      - MCP_API_BASE_URL=http://api:3001
      - MCP_DEV_MODE=true
      - MCP_REQUIRE_API_KEY=false
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ministack_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Web UI
  web:
    build:
      context: ./web_ui
      dockerfile: Dockerfile
    container_name: ministack_console_web
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ministack_network
    restart: unless-stopped

networks:
  ministack_network:
    driver: bridge

volumes:
  ministack_data:
    driver: local
  falkordb_data:
    driver: local
